name: Refresh SIP-S1 (3h)

on:
  schedule:
    - cron: '51 */3 * * *'   # 24/11/2026: org nova scaleagenciaaa, horario proprio (dashes nao rodam juntas)
  workflow_dispatch:          # gatilho confiavel = cron-job.org faz POST aqui

permissions:
  contents: write

concurrency:
  group: sip-s1-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data.js (leads x queries do Meta)
        shell: pwsh
        run: pwsh -File ./build.ps1 -Mode all
      - name: Commit data.js se mudou (a prova de corrida)
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (-not (git status --porcelain data.js)) { Write-Host "sem mudancas"; exit 0 }
          Copy-Item data.js "$env:RUNNER_TEMP/data.js"
          $ok = $false
          for ($i=0; $i -lt 5; $i++) {
            git fetch origin main
            git reset --hard origin/main
            Copy-Item "$env:RUNNER_TEMP/data.js" data.js -Force
            git add data.js
            if (-not (git status --porcelain data.js)) { Write-Host "data.js igual ao origin, nada a publicar"; $ok=$true; break }
            git commit -m ("auto: cloud " + (Get-Date -Format 'yyyy-MM-dd HH:mm'))
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $ok=$true; break }
            Write-Host ("push rejeitado, retry " + ($i+1) + "...")
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "push falhou apos 5 tentativas" }