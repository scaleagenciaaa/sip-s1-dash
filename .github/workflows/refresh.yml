name: Refresh SIP-S1 (3h)

on:
  schedule:
    - cron: '51 */3 * * *'   # 24/11/2026: org nova scaleagenciaaa, horario proprio (dashes nao rodam juntas)
  workflow_dispatch:          # gatilho confiavel = cron-job.org faz POST aqui

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sip-s1-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data.js (leads x queries do Meta)
        shell: pwsh
        run: pwsh -File ./build.ps1 -Mode all
      - name: Commit data.js se mudou
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if (git status --porcelain data.js) {
            git commit -m ("auto: cloud " + (Get-Date -Format 'yyyy-MM-dd HH:mm'))
            git pull --rebase origin main
            git push
          } else { Write-Host "sem mudancas" }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Monta _site (so arquivos publicos — sem CSV/PII)
        run: |
          mkdir -p _site
          cp index.html app.js styles.css data.js aquecimento.js .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
